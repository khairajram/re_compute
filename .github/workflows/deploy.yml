name: 🚀 Deploy to EC2 on Push

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4

      - name: ⚡ Execute SSH Commands to Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true

          script: |
            set -e

            echo "🚀 Starting deployment..."

            # 1. Go to the latest re_compute repository
            cd /home/ubuntu/re_compute

            # 2. Fetch latest GitHub state
            echo "📥 Fetching latest code..."
            git fetch origin

            # 3. Make EC2 exactly match GitHub main
            echo "🔄 Resetting to origin/main..."
            git reset --hard origin/main

            # 4. Load NVM / Node
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            echo "Node: $(node --version)"
            echo "PNPM: $(pnpm --version)"

            # 5. Install dependencies
            echo "📦 Installing dependencies..."
            pnpm install --frozen-lockfile

            # 6. Generate Prisma Client
            echo "🔧 Generating Prisma Client..."
            pnpm --filter=@repo/db run db:generate

            # 7. Build everything
            echo "🏗️ Building monorepo..."
            pnpm build

            # 8. Restart latest re_compute services
            echo "♻️ Restarting PM2 services..."
            pm2 restart next-app --update-env
            pm2 restart server --update-env
            pm2 restart ws-server --update-env

            # 9. Save PM2 process list
            pm2 save

            echo "✅ Deployment completed successfully!"

            # 10. Show final status
            pm2 list
